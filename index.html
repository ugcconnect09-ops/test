<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sveltia Test Site</title>
  <style>
    body{background:#0e0e0e;color:#ececec;font-family:system-ui,sans-serif;margin:0 auto;padding:24px;max-width:900px}
    .grid{display:grid;gap:24px}
    .frame{position:relative;width:100%;background:#1a1a1a}
    .frame.wide{aspect-ratio:16/9}
    .frame.tall{aspect-ratio:9/16;max-width:320px}
    .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .logos{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
    .logos img{height:32px;filter:grayscale(1) opacity(.7)}
    input,textarea,button{font:inherit;padding:8px;margin:4px 0}
  </style>
</head>
<body>
  <h1 id="headline"></h1>
  <p id="intro"></p>

  <h2>Stats</h2>
  <ul id="stats"></ul>

  <h2>Brands</h2>
  <div class="logos" id="logos"></div>

  <h2>Videos</h2>
  <div class="grid" id="videos"></div>

  <h2>Contact</h2>
  <form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="d9a9495c-f33f-4a3f-a108-25d582426005">
    <input type="hidden" name="subject" value="New website inquiry">
    <input type="checkbox" name="botcheck" style="display:none">
    <p><input type="text" name="name" placeholder="Name" required></p>
    <p><input type="email" name="email" placeholder="Email" required></p>
    <p><textarea name="message" placeholder="Message" required></textarea></p>
    <p><button type="submit">Send</button></p>
  </form>

  <script>
    const getJSON = (u) => fetch(u, { cache: "no-store" }).then((r) => r.json());

    function embedHTML(url, format) {
      let id = null, src = null;
      try {
        const u = new URL(url);
        const host = u.hostname.replace("www.", "");
        if (host === "youtu.be") {
          id = u.pathname.slice(1);
        } else if (host.endsWith("youtube.com")) {
          id = u.searchParams.get("v") || u.pathname.split("/").filter(Boolean).pop();
        }
        if (id) src = "https://www.youtube-nocookie.com/embed/" + id;
        if (host.endsWith("tiktok.com")) {
          const part = u.pathname.split("/video/")[1];
          id = part ? part.split("/")[0] : null;
          if (id) src = "https://www.tiktok.com/embed/v2/" + id;
        }
      } catch (e) { /* invalid URL */ }
      if (!src) return "<p>Unsupported link: " + url + "</p>";
      const cls = format === "Vertical" ? "tall" : "wide";
      return '<div class="frame ' + cls + '"><iframe src="' + src + '" loading="lazy" allowfullscreen></iframe></div>';
    }

    (async () => {
      const home = await getJSON("/data/home.json");
      document.getElementById("headline").textContent = home.headline || "";
      document.getElementById("intro").textContent = home.intro || "";
      document.getElementById("stats").innerHTML = (home.stats || [])
        .map((s) => "<li>" + s.label + ": <b>" + s.value + "</b></li>").join("");

      const logos = await getJSON("/data/logos.json");
      document.getElementById("logos").innerHTML = (logos.items || [])
        .filter((l) => l.visible !== false)
        .map((l) => '<img src="' + l.image + '" alt="' + l.name + '">').join("");

      const vids = await getJSON("/data/videos.json");
      document.getElementById("videos").innerHTML = (vids.items || [])
        .map((v) => "<div><h3>" + v.title + "</h3>" + embedHTML(v.url, v.format) + "</div>").join("");
    })();
  </script>
</body>
</html>
